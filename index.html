<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="IT portfolio of Patcharaphon Waisopha" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>พัชรพล ไวโสภา · Portfolio</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top">
        <img id="brand-photo" class="brand-photo" alt="" hidden />
        <span id="brand-name">พัชรพล ไวโสภา</span>
      </a>
      <button
        id="nav-toggle"
        class="nav-toggle"
        type="button"
        aria-label="เปิดเมนู"
        aria-expanded="false"
      >
        <span></span><span></span>
      </button>
      <nav id="nav-links" class="nav-links"></nav>
    </header>

    <main id="top">
      <section class="hero">
        <figure class="portrait">
          <img id="hero-photo" alt="พัชรพล ไวโสภา" />
        </figure>
        <div class="hero-copy">
          <p class="kicker" id="hero-kicker"></p>
          <h1>
            <span id="hero-name-th"></span>
            <small id="hero-name-en"></small>
          </h1>
          <p class="role" id="hero-role"></p>
          <p class="headline" id="hero-headline"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="#internships">ฝึกงาน</a>
            <a class="btn btn-ghost" href="#contact">ติดต่อ</a>
          </div>
          <div id="hero-socials"></div>
          <p class="location" id="hero-location"></p>
        </div>
      </section>

      <section id="stats" class="stats"></section>

      <section id="about" class="section">
        <div class="section-head">
          <p class="kicker" id="about-kicker">เกี่ยวกับ</p>
          <h2 id="about-title"></h2>
        </div>
        <div id="about-body" class="prose"></div>
      </section>

      <section id="internships" class="section">
        <div class="section-head">
          <p class="kicker">ฝึกงาน</p>
          <h2>สถานที่ฝึกงานและเว็บที่จัดทำ</h2>
        </div>
        <div id="intern-grid" class="intern-grid"></div>
      </section>

      <section id="skills" class="section">
        <div class="section-head">
          <p class="kicker">ทักษะ</p>
          <h2>ความสามารถหลัก</h2>
        </div>
        <div id="skills-grid" class="skills-grid"></div>
      </section>

      <section id="courses" class="section">
        <div class="section-head split">
          <div>
            <p class="kicker">รายวิชา</p>
            <h2>วิชาเรียน และสิ่งที่ได้เมื่อเรียนจบ</h2>
          </div>
          <div id="course-filters" class="chips"></div>
        </div>
        <div id="course-grid" class="course-grid"></div>
      </section>

      <section id="certificates" class="section">
        <div class="section-head split">
          <div>
            <p class="kicker">เกียรติบัตร</p>
            <h2>เกียรติบัตร TDGA / DGA</h2>
          </div>
          <div id="cert-filters" class="chips"></div>
        </div>
        <div id="cert-grid" class="cert-grid"></div>
      </section>

      <section id="projects" class="section">
        <div class="section-head">
          <p class="kicker">ผลงาน</p>
          <h2>ผลงานที่เลือกมาโชว์</h2>
        </div>
        <div id="project-grid" class="project-grid"></div>
      </section>

      <section id="contact" class="section contact">
        <p class="kicker">ติดต่อ</p>
        <h2 id="contact-title"></h2>
        <p id="contact-note" class="lede"></p>
        <div id="contact-cards" class="contact-cards"></div>
        <div id="contact-socials"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> <span id="footer-name"></span></p>
    </footer>

    <div id="lightbox" class="lightbox" hidden>
      <button id="lb-close" class="lb-close" type="button" aria-label="ปิด">×</button>
      <button id="lb-prev" class="lb-nav prev" type="button" aria-label="ใบก่อนหน้า">‹</button>
      <figure>
        <img id="lb-image" alt="" />
        <figcaption>
          <strong id="lb-title"></strong>
          <span id="lb-meta"></span>
          <a id="lb-pdf" href="#" target="_blank" rel="noreferrer">ดาวน์โหลด PDF</a>
        </figcaption>
      </figure>
      <button id="lb-next" class="lb-nav next" type="button" aria-label="ใบถัดไป">›</button>
    </div>

    <script src="js/content.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
